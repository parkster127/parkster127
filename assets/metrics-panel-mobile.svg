      <text x="106" y="108" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" fill="#7596aa">NON-MERGE DEFAULT-BRANCH SHAS</text>
    </g>
    <g transform="translate(0 400)">
      <rect width="796" height="164" rx="14" fill="#0a2036" stroke="#244f70"/>
      <text x="28" y="45" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#8ddfff">REPOSITORIES</text>
      <text x="28" y="110" font-family="Avenir Next, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#eaf7ff">8</text>
      <text x="106" y="108" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" fill="#7596aa">HELLO SUSHI SCOPE</text>
    </g>
    <g transform="translate(0 600)">
      <rect width="796" height="164" rx="14" fill="#0a2036" stroke="#244f70"/>
      <text x="28" y="45" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#8ddfff">CURRENT CODEBASES</text>
      <text x="28" y="110" font-family="Avenir Next, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#eaf7ff">4</text>
      <text x="106" y="108" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" fill="#7596aa">PRODUCT REPOSITORIES</text>
    </g>
  </g>
  <text x="52" y="1125" font-family="Avenir Next, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.05" fill="#7899ad">UTC WINDOW 2026-01-01 → 2026-09-25T19:30:22Z · 434 MERGE COMMITS EXCLUDED</text>
