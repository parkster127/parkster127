    <text x="0" y="141" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" fill="#9fc4d7">Populate from the verified</text>
    <text x="0" y="166" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" fill="#9fc4d7">PR and contribution export.</text>
  </g>
  <g transform="translate(52 300)">

    <g transform="translate(0 0)">
