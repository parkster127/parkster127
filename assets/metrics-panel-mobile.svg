      <text x="28" y="110" font-family="Avenir Next, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#eaf7ff">351</text>
      <text x="106" y="108" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" fill="#7596aa">AUTHORED BY PARKSTER127</text>
    </g>
    <g transform="translate(0 200)">
