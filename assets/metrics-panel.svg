  <text x="50" y="330" font-family="Avenir Next, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.15" fill="#7899ad">UTC WINDOW 2026-01-01 → 2026-09-25T19:30:22Z · RELEASE/SYNC PRS INCLUDED · 434 MERGE COMMITS EXCLUDED</text>
</svg>
