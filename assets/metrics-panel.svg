      <text x="22" y="88" font-family="Avenir Next, Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#eaf7ff">8</text>
      <text x="22" y="111" font-family="Avenir Next, Segoe UI, sans-serif" font-size="11" fill="#7596aa">HELLO SUSHI SCOPE</text>
    </g>
    <g transform="translate(828 0)">
      <rect width="244" height="130" rx="13" fill="#0a2036" stroke="#244f70"/>
      <text x="22" y="35" font-family="Avenir Next, Segoe UI, sans-serif" font-size="11" font-weight="800" letter-spacing="1.7" fill="#8ddfff">CURRENT CODEBASES</text>
      <text x="22" y="88" font-family="Avenir Next, Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#eaf7ff">4</text>
      <text x="22" y="111" font-family="Avenir Next, Segoe UI, sans-serif" font-size="11" fill="#7596aa">PRODUCT REPOSITORIES</text>
