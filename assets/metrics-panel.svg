    <text x="0" y="42" font-family="Avenir Next, Segoe UI, sans-serif" font-size="29" font-weight="800" fill="#f0f8ff">Evidence before ego.</text>
    <text x="0" y="70" font-family="Avenir Next, Segoe UI, sans-serif" font-size="14" fill="#9fc4d7">A calm, auditable panel for the final PR and contribution export.</text>
  </g>
