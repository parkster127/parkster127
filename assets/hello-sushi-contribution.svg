<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Hello Sushi featured build</title>
  <desc id="svg-desc">A visual case-study banner for project architecture, payment boundaries, real-time order flow, and operational handoffs.</desc>

<style>
  @keyframes drift { 0%,100% { transform: translate3d(0,0,0); opacity:.35 } 50% { transform: translate3d(10px,-8px,0); opacity:.9 } }
  @keyframes beacon { 0%,100% { opacity:.25; transform:scale(.96) } 50% { opacity:1; transform:scale(1.04) } }
  @keyframes sweep { from { stroke-dashoffset: 460 } to { stroke-dashoffset: 0 } }
  @keyframes rise { 0%,100% { transform:translateY(0); opacity:.35 } 50% { transform:translateY(-5px); opacity:1 } }
  .drift { animation: drift 9s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .beacon { animation: beacon 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .sweep { stroke-dasharray:460; animation:sweep 8s linear infinite; }
  .rise { animation:rise 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; } }
</style>


<defs>
  <linearGradient id="hello-sushi-wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111f"/>
    <stop offset=".62" stop-color="#08192b"/>
    <stop offset="1" stop-color="#0d2a47"/>
  </linearGradient>
  <linearGradient id="hello-sushi-cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#20b9ff" stop-opacity="0"/>
    <stop offset=".48" stop-color="#20b9ff"/>
    <stop offset="1" stop-color="#9ce8ff"/>
  </linearGradient>
  <linearGradient id="hello-sushi-fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#04101e" stop-opacity=".98"/>
    <stop offset=".52" stop-color="#04101e" stop-opacity=".76"/>
    <stop offset="1" stop-color="#04101e" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="hello-sushi-card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#122f4c" stop-opacity=".92"/>
    <stop offset="1" stop-color="#071524" stop-opacity=".92"/>
  </linearGradient>
  <filter id="hello-sushi-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="hello-sushi-grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#8cdcff" stroke-opacity=".09" stroke-width="1"/>
  </pattern>
</defs>
  <rect width="1200" height="340" rx="18" fill="url(#hello-sushi-wash)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#2a5879"/>
  <path d="M42 274H1158" stroke="#1b4565" stroke-width="1"/>
  <path d="M58 275 C220 204 294 287 424 215 S668 142 820 217 S1035 286 1144 172" fill="none" stroke="#33c4ff" stroke-opacity=".22" stroke-width="2" class="sweep"/>
  <path d="M58 275 C220 204 294 287 424 215 S668 142 820 217 S1035 286 1144 172" fill="none" stroke="#b1edff" stroke-opacity=".4" stroke-width="1" stroke-dasharray="2 9"/>
  <g transform="translate(50 42)">
    <rect width="248" height="29" rx="14.5" fill="#0d2a47" stroke="#2d79a2"/>
    <text x="16" y="19" font-family="Avenir Next, Segoe UI, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#8de4ff">FEATURED BUILD / HELLO SUSHI</text>
  </g>
  <g transform="translate(50 112)">
    <text x="0" y="0" font-family="Avenir Next, Segoe UI, sans-serif" font-size="37" font-weight="800" letter-spacing="-1" fill="#f0f8ff">Turning orders into an</text>
    <text x="0" y="46" font-family="Avenir Next, Segoe UI, sans-serif" font-size="37" font-weight="800" letter-spacing="-1" fill="#f0f8ff">operational loop.</text>
    <text x="0" y="84" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#9fc4d7">Project architecture · Integration boundaries · Production-minded delivery</text>
  </g>
  <g transform="translate(50 224)">
    <g transform="translate(0 0)">
      <circle cx="10" cy="10" r="8" fill="#20b9ff" class="beacon"/>
      <text x="30" y="15" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#d7f5ff">PAYMENTS</text>
      <text x="30" y="38" font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" fill="#90aec1">Gateway and webhook edges</text>
    </g>
    <g transform="translate(365 0)">
      <circle cx="10" cy="10" r="8" fill="#65d9ff" class="beacon" style="animation-delay:1.1s"/>
      <text x="30" y="15" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#d7f5ff">REAL-TIME</text>
      <text x="30" y="38" font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" fill="#90aec1">Order state and live updates</text>
    </g>
    <g transform="translate(730 0)">
      <circle cx="10" cy="10" r="8" fill="#a8eaff" class="beacon" style="animation-delay:2.2s"/>
      <text x="30" y="15" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#d7f5ff">OPERATIONS</text>
      <text x="30" y="38" font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" fill="#90aec1">Reliable handoffs to the team</text>
    </g>
  </g>
</svg>
